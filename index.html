<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pinesight Systems</title>
<meta name="description" content="Pinesight Systems LLC — apps and software. Makers of PanInto3D.">
<style>
  :root {
    --bg: #f6f7f4; --fg: #1d2420; --muted: #5b665f; --accent: #2f5d46; --line: #d9ded8;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #121614; --fg: #e6ebe7; --muted: #9aa69f; --accent: #7fbf9c; --line: #2a322e; }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--fg);
    font: 17px/1.6 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  main { max-width: 640px; margin: 0 auto; padding: 72px 20px 48px; }
  .mark { width: 40px; height: 40px; color: var(--accent); }
  h1 { font-size: 2rem; margin: 16px 0 4px; letter-spacing: -0.01em; }
  .tag { color: var(--muted); margin: 0 0 48px; }
  h2 { font-size: 1.1rem; margin: 0 0 8px; }
  .app { border-top: 1px solid var(--line); padding: 24px 0; }
  .app p { margin: 0 0 8px; }
  a { color: var(--accent); }
  footer { border-top: 1px solid var(--line); margin-top: 24px; padding-top: 24px; color: var(--muted); font-size: 0.9rem; }
</style>
</head>
<body>
<main>
  <svg class="mark" viewBox="0 0 40 40" aria-hidden="true">
    <path d="M20 3 L33 22 H26 L35 35 H5 L14 22 H7 Z" fill="currentColor"/>
  </svg>
  <h1>Pinesight Systems</h1>
  <p class="tag">Apps and software, thoughtfully engineered.</p>

  <section class="app">
    <h2>PanInto3D</h2>
    <p>Make stereo 3D photos with a powerful new workflow.</p>
    <p>Coming soon to Google Play. <a href="/paninto3d/privacy.html">Privacy policy</a></p>
  </section>

  <footer>
    Pinesight Systems LLC · 116 Agnes Rd, Ste 200, Knoxville, TN 37919<br>
    <a href="mailto:contact@pinesightsystems.com">contact@pinesightsystems.com</a>
  </footer>
</main>
</body>
</html>
